# Integracion continua del proyecto MLOps de diabetes.
# Objetivo: comprobar automaticamente que todo el proceso sigue funcionando.

name: CI - Diabetes MLOps

# Ejecutar al cambiar main, al proponer cambios o manualmente.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Solo necesitamos permiso para leer el codigo del repositorio.
permissions:
  contents: read

jobs:
  verify-pipeline:
    # GitHub prepara una maquina nueva: no depende de nuestro Colab.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Primera fase: obtener, validar y preparar los datos.
      # Si la validacion falla, no tiene sentido entrenar el modelo.
      - name: Extraer datos
        run: python -m src.data.extract

      - name: Validar datos
        run: python -m src.data.validate

      - name: Limpiar datos
        run: python -m src.data.clean

      - name: Auditar valores extremos
        run: python -m src.data.preprocess

      # Segunda fase: reconstruir MLflow (SQLite y artefactos) desde cero.
      # No subimos mlflow.db ni mlruns al repositorio.
      - name: Entrenar candidatos y registrar ejecuciones MLflow
        run: python -m src.models.train

      - name: Registrar mejor modelo
        run: python -m src.models.register_model

      # El Quality Gate compara el campeon con un modelo de referencia.
      # Solo se asigna el alias champion si supera la evaluacion.
      - name: Evaluar modelo y aplicar puerta de calidad
        run: python -m src.models.evaluate_model

      # Ultima fase: verificar las respuestas HTTP de la API con Pytest.
      - name: Verificar API con Pytest
        run: python -m pytest tests/test_api.py -v
